, "q": "Wir müssen unseren Termin leider ___.", "correct": "verschieben", "th": "เลื่อนนัด", "answer": "Wir müssen unseren Termin leider verschieben.", "example": "Könnten wir den Termin auf Donnerstag verschieben?", "vocab": "einen Termin verschieben = เลื่อนนัด"}];let deck=[],cur,show=false,seconds=60,left=60,timer=null;const $=x=>document.getElementById(x);function mix(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function newDeck(){deck=mix(cards.map(c=>c.id));count()}function count(){$("count").textContent="การ์ดเหลือ "+deck.length+"/50"}function stop(){if(window.speechSynthesis)speechSynthesis.cancel()}function render(){$("tag").textContent="KARTE "+cur.id+"/50";$("question").textContent=cur.q.replace("___","________");$("thai").textContent="🇹🇭 ความหมาย: "+cur.th;$("vocab").textContent=cur.vocab;$("answer").innerHTML="<b>Feste Wendung:</b> "+cur.phrase+"<br><b>คำที่เติม:</b> "+cur.correct+"<br><b>ประโยคเต็ม:</b> "+cur.answer+"<br><b>ตัวอย่างอีกประโยค:</b> "+cur.example+"<br><b>🇹🇭 ความหมาย:</b> "+cur.th;$("answer").className="answer"+(show?" on":"")}function draw(){if(!deck.length)newDeck();cur=cards.find(c=>c.id===deck.pop());show=false;stop();render();count()}function clock(){$("clock").textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")}function pause(){if(timer){clearInterval(timer);timer=null}}$("next").onclick=draw;$("shuffle").onclick=()=>{newDeck();draw()};$("reveal").onclick=()=>{show=!show;$("answer").className="answer"+(show?" on":"")};$("duration").onchange=()=>{pause();seconds=+$("duration").value;left=seconds;clock()};$("start").onclick=()=>{if(timer){pause();return}if(left<=0)left=seconds;timer=setInterval(()=>{left--;clock();if(left<=0)pause()},1000)};$("reset").onclick=()=>{pause();left=seconds;clock()};$("voice").onclick=()=>{stop();if(window.speechSynthesis){let u=new SpeechSynthesisUtterance(cur.answer+". "+cur.example);u.lang="de-DE";u.rate=.87;speechSynthesis.speak(u)}};$("stop").onclick=stop;newDeck();draw();clock();</script></html>
